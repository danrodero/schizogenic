name: Learning task
description: A scoped implementation assignment selected by the lead agent
title: "[Learning] "
body:
  - type: markdown
    attributes:
      value: |
        This issue provides a short lesson, a starting point, and a concrete definition of done.
  - type: input
    id: requirements
    attributes:
      label: Linked requirements
      description: Confirmed specification IDs or accepted ADRs.
      placeholder: "PROD-000, STORY-000, ADR-0000"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable capability or engineering result should exist?
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: Learning objectives
      description: One main new concept, a short explanation, prerequisites/refresher, and why this fits current evidence.
    validations:
      required: true
  - type: textarea
    id: starting
    attributes:
      label: Starting point and steps
      description: Existing file paths, relevant APIs, first action, and a short ordered checklist. Mark suggestions as suggestions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete input/action and expected result examples, including the relevant failure.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: quality
    attributes:
      label: Quality and verification obligations
      description: Name each required test scenario, exact commands, working directory, prerequisites, and expected results.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and out of scope
      description: Explicit non-goals, optional work, expected files, and short PR submission instructions.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Primary references
      description: One or two official links, with the section and the question it answers. Supplement the lesson.
  - type: checkboxes
    id: agreement
    attributes:
      label: Learning agreement
      options:
        - label: The developer will implement the feature and its initial tests.
          required: true
        - label: The agent will explain concepts, provide concrete examples, and help me finish the agreed scope.
          required: true
